Pixel Perfect Editor==Pixel Perfect 編輯器
Scale==縮放
Each box is 1 Yalm by 1 Yalm==每個方格為 1 米 x 1 米
Help==說明
Pixel Perfect Editor Help==Pixel Perfect 編輯器說明
Here you can see and edit your overlay in real time.==在此可即時檢視並編輯你的疊加層繪製。
Select the Doodle tab in the config, and the selected doodle will highlight in the editor.==在設定中選擇「塗鴉」分頁，所選的塗鴉將在編輯器中反白顯示。
If you have a `line` doodle, you can also <Left Click> the ends to move them, and <Left Click> again to place them down.==若你有「線條」類型的塗鴉，可以<左鍵點擊>端點來移動它們，再次<左鍵點擊>即可放置。
The dot in the centre is your player character.==正中央的圓點代表你的角色。
