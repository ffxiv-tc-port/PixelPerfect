Welcome to Pixel Perfect!==歡迎使用 Pixel Perfect！
Hey, and thanks for installing my plugin!==嗨，感謝你安裝這款外掛！
Use the config menu, and add a doodle to get started.==使用設定選單並新增一個塗鴉即可開始使用。
Open Config==開啟設定
Pixel Perfect Config==Pixel Perfect 設定
Config==設定
Hide Updates==隱藏更新訊息
Never show any messages.==永不顯示任何訊息。
Enable==啟用
Turn the doodle on/off entirely==完全開啟/關閉此塗鴉
Combat==戰鬥中
Only show when engaged in combat==僅在戰鬥中顯示
Instance==副本中
Only show when in an instance (a dungeon/raid etc)==僅在副本中顯示（地下城/團隊等）
Unsheathed==拔劍時
Only show when your weapon is unsheathed==僅在武器拔出時顯示
Name==名稱
Name the doodle!==為塗鴉命名！
Delete==刪除
Delete the doodle==刪除此塗鴉
Add Doodle==新增塗鴉
Show Editor==顯示編輯器
You can export and import your doodles to share, by using the buttons below.==你可以使用下方按鈕匯出並匯入你的塗鴉以便分享。
Either export your current doodles to your clipboard, and then share the string with your friends, or import a currently copied exported string into your own doodles, by using the import button!==可以將目前的塗鴉匯出到剪貼簿，並將字串分享給朋友；或使用匯入按鈕，將目前複製的匯出字串匯入到你自己的塗鴉中！
Export==匯出
Copied to clipboard==已複製到剪貼簿
Exports your current Doodles to your clipboard for sharing!==將目前的塗鴉匯出到剪貼簿以便分享！
Import from Clipboard==從剪貼簿匯入
Imported successfully==匯入成功
Could not import==無法匯入
Imports your current clipboard to your Doodles!==將目前剪貼簿的內容匯入你的塗鴉！
